# LiteFWM management UI. server.port is managed from System > Management.
server.port = 80

auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/litefwm/htpasswd"
# Keep HTTP Basic authentication on the SPA and normal API traffic.
# Only API requests presenting an X-API-Key header bypass Lighttpd Basic.
# CGI independently verifies the token with the privileged key registry.
auth.require = ( "/" => ( "method" => "basic", "realm" => "LiteFWM", "require" => "valid-user" ) )
$HTTP["url"] =~ "^/api(/|[.]cgi/)" {
  $REQUEST_HEADER["X-API-Key"] =~ "^lfw_sk_[a-f0-9]{64}$" {
    auth.require = ()
  }
}

alias.url += ( "/api.cgi" => "/usr/lib/litefwm/cgi/api.cgi" )
cgi.assign = ( ".cgi" => "" )
url.rewrite-once = ( "^/api/(.*)$" => "/api.cgi/$1" )

setenv.add-response-header = (
  "X-Content-Type-Options" => "nosniff",
  "X-Frame-Options" => "DENY",
  "Referrer-Policy" => "no-referrer",
  "Content-Security-Policy" => "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
)
server.max-read-idle = 120
server.max-write-idle = 120
