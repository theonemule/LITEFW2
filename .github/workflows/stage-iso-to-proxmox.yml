name: Stage verified LiteFW ISO for Proxmox VM 107

on:
  push:
    paths:
      - .github/workflows/stage-iso-to-proxmox.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  stage-iso:
    name: Download and verify GitHub ISO on LiteFW dev runner
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Download successful LiteFW 2.2.4 build artifact
        uses: actions/download-artifact@v4
        with:
          repository: theonemule/LITEFW2
          run-id: 41235473783
          name: litefw2-alpine-appliance-50
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/litefw-vm107-stage
      - name: Verify SHA256 checksum and stage ISO for Proxmox
        shell: bash
        run: |
          set -euo pipefail
          src="${{ runner.temp }}/litefw-vm107-stage"
          dest="/opt/github-actions-runner/LITEFW2/_work/_litefw_iso_transfer"
          (cd "$src" && sha256sum -c SHA256SUMS)
          test -s "$src/litefw2-2.2.4-alpine3.24-x86_64.iso"
          install -d -m 0755 "$dest"
          install -m 0644 "$src/litefw2-2.2.4-alpine3.24-x86_64.iso" "$dest/litefw2-2.2.4-alpine3.24-x86_64.iso"
          install -m 0644 "$src/SHA256SUMS" "$dest/SHA256SUMS"
          (cd "$dest" && sha256sum -c SHA256SUMS)
          echo "Verified LiteFW 2.2.4 ISO staged on dev runner for Proxmox VM 107."
      - name: Publish verified LiteFW 2.2.4 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="${{ runner.temp }}/litefw-vm107-stage"
          (cd "$src" && sha256sum -c SHA256SUMS)
          test -s "$src/litefw2-2.2.4-alpine3.24-x86_64.iso"
          if gh release view v2.2.4 --repo theonemule/LITEFW2 >/dev/null 2>&1; then
            gh release upload v2.2.4 "$src/litefw2-2.2.4-alpine3.24-x86_64.iso" "$src/SHA256SUMS" --repo theonemule/LITEFW2 --clobber
          else
            gh release create v2.2.4 "$src/litefw2-2.2.4-alpine3.24-x86_64.iso" "$src/SHA256SUMS" --repo theonemule/LITEFW2 --target 9e67f28092b5271e77c7af27e4a1428dfe018f18 --title "LiteFW2 v2.2.4" --notes "Verified bootable Alpine-based LiteFW appliance installer. Select target disk, configure WAN/LAN, set web administrator, confirm disk erase, partition/format and install the full OS. SHA256SUMS included."
          fi
