name: Stage verified LiteFW release ISO on Proxmox development runner

# Deliberately manual-only: pushing a firewall release must never alter a
# Proxmox host or accidentally deploy it to a running VM.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, e.g. v2.2.25; latest selects the newest release'
        required: true
        type: string
        default: latest

permissions:
  contents: read

jobs:
  stage-iso:
    name: Download and verify published ISO on development runner
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Verify release downloads and stage to runner only
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo 'gh CLI is required on self-hosted runner'; exit 1; }
          case "$REQUESTED_TAG" in
            latest) tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName');;
            v2.2.*) tag=$REQUESTED_TAG;;
            *) echo 'Invalid release tag' >&2; exit 2;;
          esac
          [[ "$tag" =~ ^v2[.]2[.][0-9]+$ ]] || { echo "Unsafe tag: $tag" >&2; exit 2; }
          version=${tag#v}
          iso="litefw2-$version-alpine3.24-x86_64.iso"
          src="$RUNNER_TEMP/litefw-stage-$version"
          dest="/opt/github-actions-runner/LITEFW2/_work/_litefw_iso_transfer"
          mkdir -p "$src"
          # Download all four assets so the complete release checksum manifest
          # can be verified instead of silently ignoring missing assets.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$src"
          test -s "$src/$iso"
          test -s "$src/SHA256SUMS"
          (cd "$src" && sha256sum -c SHA256SUMS)
          install -d -m 0755 "$dest"
          install -m 0644 "$src/$iso" "$dest/$iso"
          install -m 0644 "$src/SHA256SUMS" "$dest/SHA256SUMS"
          (cd "$dest" && sha256sum -c --ignore-missing SHA256SUMS)
          echo "Verified $iso staged on development runner, not installed in a VM."
