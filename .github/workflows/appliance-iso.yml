name: Build LiteFW appliance ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  appliance:
    name: LiteFW x86_64 ISO and offline installation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate appliance source
        shell: bash
        run: |
          set -euo pipefail
          test -s VERSION
          test -x tools/build-appliance-iso.sh
          test -f iso/mkimg.litefwm.sh
          test -f iso/genapkovl-litefwm.sh
          test -x bin/litefw-web-bind
          ./tests/web-lan-security.sh
          ./tests/temporary-root-ssh.sh
          ./tests/inplace-upgrade-smoke.sh
          ./tests/upgrade-check-test.sh
          ./tests/dhcp-per-interface-options.sh
          ./tests/firewall-staged-apply.sh
          ./tests/firewall-recovery.sh
          while IFS= read -r -d '' script; do
            if head -n 1 "$script" | grep -Eq '^#!.*(/|env )bash([[:space:]]|$)'; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done < <(find bin lib modules iso tools tests -type f -name '*.sh' -print0)
          for script in bin/litefw-* iso/setup-alpine-litefwm; do sh -n "$script"; done
          python3 -m compileall -q tests
          if grep -RniE 'apt(-get)? (install|update)|debian|ubuntu' install.sh iso tools/build-appliance-iso.sh; then
            echo 'Unsupported Debian/Ubuntu dependency in appliance build path' >&2
            exit 1
          fi
      - name: Verify single-command Alpine firewall installer
        run: |
          set -euo pipefail
          ./tests/iso-installer-integration.sh
      - name: Install ISO verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 qemu-utils python3-pexpect
      - name: Build standalone Alpine ISO
        env:
          ALPINE_VERSION: '3.24'
          ARCH: x86_64
          OUTDIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          ./tools/build-appliance-iso.sh
          mapfile -t images < <(find dist -maxdepth 1 -type f -name '*litefwm*.iso')
          test "${#images[@]}" -eq 1
          mv "${images[0]}" "dist/litefw2-$(cat VERSION)-alpine3.24-x86_64.iso"
          xorriso -indev dist/*.iso -report_el_torito plain
          tar -czf "dist/litefw2-$(cat VERSION)-runtime.tar.gz" VERSION bin lib modules cgi www
          (cd dist && sha256sum *.iso *.tar.gz > SHA256SUMS)
      - name: Offline installation smoke test
        env:
          LITEFWM_OFFLINE_WORK: ${{ runner.temp }}/litefw2-offline
          LITEFWM_QEMU_ACCEL: tcg
        run: |
          set -euo pipefail
          python3 tests/iso-offline-install-smoke.py dist/*.iso
      - name: Upload serial logs on test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: litefw2-offline-test-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/litefw2-offline/*-serial.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: litefw2-alpine-appliance-${{ github.run_number }}
          path: |
            dist/*.iso
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish versioned GitHub release assets
        # Main builds create the version tag/release after successful ISO verification.
        # Tagged builds remain supported; PRs never publish releases.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            test "$SOURCE_NAME" = "$tag" || { echo "Tag $SOURCE_NAME does not match VERSION ($tag)" >&2; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its immutable assets."
            exit 0
          fi
          if [[ "$SOURCE_REF" == refs/heads/main ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag exists without a release; run the workflow on that tag to publish its matching ISO." >&2
              exit 1
            fi
            gh release create "$tag" dist/*.iso dist/*.tar.gz dist/SHA256SUMS --target "$GITHUB_SHA" --title "LiteFW2 $tag" --notes "Bootable Alpine Linux x86_64 firewall appliance ISO. SHA256SUMS included. New installations use the ISO. Existing appliances may upgrade the application runtime in place using bin/litefw-upgrade and the release runtime bundle; existing configuration is preserved."
          else
            gh release create "$tag" dist/*.iso dist/*.tar.gz dist/SHA256SUMS --title "LiteFW2 $tag" --notes "Bootable Alpine Linux x86_64 firewall appliance ISO. SHA256SUMS included. New installations use the ISO. Existing appliances may upgrade the application runtime in place using bin/litefw-upgrade and the release runtime bundle; existing configuration is preserved." --verify-tag
          fi