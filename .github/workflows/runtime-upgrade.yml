name: Publish LiteFW runtime upgrade

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Validate and publish LiteFW runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate runtime upgrade
        shell: bash
        run: |
          set -euo pipefail
          test -x tools/package-runtime-upgrade.sh
          ./tests/module-contract-test.sh
          ./tests/module-install-verification.sh
          ./tests/api-resource-test.sh
          ./tests/dns-provider-presets.sh
          ./tests/bind-zone-management.sh
          ./tests/inplace-upgrade-smoke.sh
          ./tests/upgrade-check-test.sh
          node --check www/app.js
          if command -v google-chrome >/dev/null 2>&1; then
            python3 tests/ui-modules-smoke.py
          fi

      - name: Package versioned upgrade and checksums
        shell: bash
        run: |
          set -euo pipefail
          ./tools/package-runtime-upgrade.sh dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: litefw2-runtime-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub runtime update for LiteFW UI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          bundle="litefw2-$version-runtime.tar.gz"
          if [[ "$SOURCE_REF" == refs/tags/* && "$SOURCE_NAME" != "$tag" ]]; then
            echo "Git tag $SOURCE_NAME does not match VERSION $tag" >&2
            exit 1
          fi
          # Do not mutate an already published runtime archive. If an ISO
          # workflow won the race, its combined release is sufficient.
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$bundle"; then
              echo "Release $tag already contains $bundle; leaving it unchanged."
              exit 0
            fi
            gh release upload "$tag" "dist/$bundle"
            echo "Attached runtime archive to the existing $tag release."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            # Existing version tags are never re-pointed to a different commit.
            git_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            test "$git_sha" = "$GITHUB_SHA" || {
              echo "Existing $tag tag belongs to another commit; refusing to reassign" >&2
              exit 1
            }
            gh release create "$tag" "dist/$bundle" dist/SHA256SUMS --verify-tag \
              --title "LiteFW2 $tag" \
              --notes "In-place LiteFW runtime upgrade. The System > Software updates UI downloads and verifies this archive before applying it. Existing network, DNS, DHCP and firewall configuration is preserved."
          else
            gh release create "$tag" "dist/$bundle" dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "LiteFW2 $tag" \
              --notes "In-place LiteFW runtime upgrade. The System > Software updates UI downloads and verifies this archive before applying it. Existing network, DNS, DHCP and firewall configuration is preserved."
          fi
          gh release view "$tag" --json name,tagName,assets
