# LiteFWM lighttpd fragment.
server.modules += (
  "mod_auth",
  "mod_authn_file",
  "mod_cgi",
  "mod_alias",
  "mod_rewrite",
  "mod_setenv"
)

server.document-root = "/usr/share/litefwm/www"
server.port = @LITEFWM_PORT@
index-file.names = ( "index.html" )

auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/litefwm/htpasswd"
auth.require = (
  "/" => (
    "method" => "basic",
    "realm" => "LiteFWM",
    "require" => "valid-user"
  )
)

alias.url += (
  "/api.cgi" => "/usr/lib/litefwm/cgi/api.cgi"
)

cgi.assign = ( ".cgi" => "" )

url.rewrite-once = (
  "^/api/?(.*)$" => "/api.cgi/$1"
)

url.rewrite-if-not-file = (
  "^/(?!(api|api[.]cgi)(?:/|$)).*" => "/index.html"
)

setenv.add-response-header = (
  "Cache-Control" => "no-cache",
  "X-Content-Type-Options" => "nosniff",
  "X-Frame-Options" => "DENY",
  "Referrer-Policy" => "no-referrer",
  "Content-Security-Policy" => "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
)

server.max-read-idle = 300
server.max-write-idle = 300
